<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes Viewer - Transparent SF</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/darkmode.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
        body {
            font-family: 'IBM Plex Sans', Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            color: var(--ink-black);
            background: var(--bg-primary);
            line-height: 1.6;
        }
        .header {
            border-bottom: 1px solid var(--border-primary);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .header h1 {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 24px;
            margin: 0;
            color: var(--text-primary);
        }
        .header p {
            color: var(--text-secondary);
            margin: 8px 0 0 0;
            font-size: 14px;
        }
        .notes-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .notes-content {
            white-space: pre-wrap;
            font-size: 14px;
            color: var(--text-primary);
            max-width: 100%;
            overflow-wrap: break-word;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        .error {
            background: var(--warm-coral);
            color: white;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .stat {
            background: var(--bg-tertiary);
            padding: 8px 12px;
            border-radius: 4px;
        }
        .refresh-btn {
            background: var(--bright-purple);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
        }
        .refresh-btn:hover {
            opacity: 0.9;
        }
        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>System Notes</h1>
        <p>Combined notes from the system's note management system</p>
    </div>
    
    <button id="refresh-btn" class="refresh-btn" onclick="loadNotes()">Refresh Notes</button>
    
    <div id="stats" class="stats" style="display: none;">
        <div class="stat">
            <strong>Token Count:</strong> <span id="token-count">0</span>
        </div>
        <div class="stat">
            <strong>Last Updated:</strong> <span id="last-updated">Loading...</span>
        </div>
    </div>
    
    <div id="loading" class="loading">
        Loading notes...
    </div>
    
    <div id="error" class="error" style="display: none;">
    </div>
    
    <div id="notes-container" class="notes-container" style="display: none;">
        <div id="notes-content" class="notes-content">
        </div>
    </div>

    <script>
        async function loadNotes() {
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const containerEl = document.getElementById('notes-container');
            const contentEl = document.getElementById('notes-content');
            const statsEl = document.getElementById('stats');
            const refreshBtn = document.getElementById('refresh-btn');
            
            // Show loading state
            loadingEl.style.display = 'block';
            errorEl.style.display = 'none';
            containerEl.style.display = 'none';
            statsEl.style.display = 'none';
            refreshBtn.disabled = true;
            
            try {
                const response = await fetch('/backend/get-notes');
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || `HTTP ${response.status}`);
                }
                
                if (data.success && data.content) {
                    // Show content
                    contentEl.textContent = data.content;
                    containerEl.style.display = 'block';
                    
                    // Update stats
                    document.getElementById('token-count').textContent = data.token_count || '0';
                    document.getElementById('last-updated').textContent = new Date().toLocaleString();
                    statsEl.style.display = 'flex';
                    
                    loadingEl.style.display = 'none';
                } else {
                    throw new Error(data.error || 'No notes content available');
                }
            } catch (error) {
                console.error('Error loading notes:', error);
                errorEl.textContent = 'Failed to load notes: ' + error.message;
                errorEl.style.display = 'block';
                loadingEl.style.display = 'none';
            } finally {
                refreshBtn.disabled = false;
            }
        }
        
        // Load notes on page load
        document.addEventListener('DOMContentLoaded', loadNotes);
    </script>
    <script src="/static/js/darkmode.js"></script>
</body>
</html>
