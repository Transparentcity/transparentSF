<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/darkmode.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
        body {
            font-family: 'IBM Plex Sans', Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--ink-black);
            background: var(--bg-primary);
        }
        .settings-container {
            display: flex;
            height: 100vh;
        }
        .tabs {
            width: 220px;
            padding: 20px 12px;
            background: var(--bg-primary);
        }
        .tabs h2 {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 16px;
            margin: 0 0 12px 8px;
            color: var(--text-primary);
        }
        .tab-btn {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            margin: 6px 4px;
            border: none;
            border-radius: 6px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            transition: background .2s ease;
            font-size: 14px;
        }
        .tab-btn:hover { background: var(--bg-tertiary); }
        .tab-btn.active {
            background: var(--bright-purple);
            color: #ffffff;
        }
        .panel {
            flex: 1;
            padding: 20px;
            overflow: auto;
            background: var(--bg-primary);
        }
        .panel h3 {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            margin: 0 0 12px 0;
        }
        .card {
            background: #ffffff;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .btn {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn.primary { background: var(--bright-purple); color: #fff; }
        .btn.secondary { background: var(--cloud-gray); color: var(--ink-black); }
        .btn.danger { background: var(--warm-coral); color: #fff; }
        .status { margin-top: 10px; font-weight: 500; display: none; }
        .status.ok { color: #1b5e20; }
        .status.err { color: #b71c1c; }
        input[type="file"] { display: none; }
        label.file { padding: 10px 14px; background: var(--cloud-gray); border-radius: 6px; cursor: pointer; display: inline-block; }
        .info { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
    </style>
    <script>
        async function fetchJSON(url, opts) {
            const res = await fetch(url, opts);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.headers.get('content-type')?.includes('application/json') ? res.json() : res;
        }
        function show(el, msg, ok=true) {
            el.style.display = 'block';
            el.className = 'status ' + (ok ? 'ok' : 'err');
            el.textContent = msg;
        }
        async function initDatabaseTab() {
            try {
                const data = await fetchJSON('/backend/api/database-info');
                document.getElementById('db-status').textContent = data.db_status || 'Unknown';
                document.getElementById('db-size').textContent = data.db_size || 'Unknown';
                document.getElementById('db-last-backup').textContent = data.last_backup || 'Never';
            } catch (e) {}
        }
        async function createBackup() {
            const s = document.getElementById('db-backup-status');
            try {
                const data = await fetchJSON('/backend/api/database-backup', { method: 'POST' });
                show(s, 'Backup created. Downloading...', true);
                if (data.download_url) { const a = document.createElement('a'); a.href = data.download_url; a.download = data.filename || 'database_backup.sql'; document.body.appendChild(a); a.click(); a.remove(); }
                setTimeout(initDatabaseTab, 800);
            } catch (e) { show(s, 'Backup failed: ' + e.message, false); }
        }
        let dbRestoreFile = null;
        function onPickDbRestore(input) { dbRestoreFile = input.files[0] || null; document.getElementById('db-file-label').textContent = dbRestoreFile ? 'Selected: ' + dbRestoreFile.name : 'Choose Backup File'; }
        async function restoreDatabase() {
            const s = document.getElementById('db-restore-status');
            if (!dbRestoreFile) return show(s, 'Select a file first.', false);
            if (!confirm('This will replace all database data. Continue?')) return;
            const fd = new FormData(); fd.append('backup_file', dbRestoreFile);
            try {
                await fetchJSON('/backend/api/database-restore', { method: 'POST', body: fd });
                show(s, 'Database restored successfully.');
            } catch (e) { show(s, 'Restore failed: ' + e.message, false); }
        }
        let metricsRestoreFile = null;
        function onPickMetricsRestore(input) { metricsRestoreFile = input.files[0] || null; document.getElementById('metrics-file-label').textContent = metricsRestoreFile ? 'Selected: ' + metricsRestoreFile.name : 'Choose Metrics Backup File'; }
        async function backupMetrics() {
            const s = document.getElementById('metrics-backup-status');
            try {
                const data = await fetchJSON('/api/backup-metrics-table', { method: 'POST' });
                show(s, 'Metrics backup created. Downloading...');
                if (data.download_url) { const a = document.createElement('a'); a.href = data.download_url; a.download = data.filename || 'metrics_backup.sql'; document.body.appendChild(a); a.click(); a.remove(); }
            } catch (e) { show(s, 'Metrics backup failed: ' + e.message, false); }
        }
        async function restoreMetrics() {
            const s = document.getElementById('metrics-restore-status');
            if (!metricsRestoreFile) return show(s, 'Select a file first.', false);
            if (!confirm('This will replace all metrics configuration. Continue?')) return;
            const fd = new FormData(); fd.append('backup_file', metricsRestoreFile);
            try { await fetchJSON('/api/restore-metrics-from-backup', { method: 'POST', body: fd }); show(s, 'Metrics restored successfully.'); } catch (e) { show(s, 'Metrics restore failed: ' + e.message, false); }
        }
        async function initLogsTab() {
            try {
                const data = await fetchJSON('/backend/api/session-logs-info');
                document.getElementById('logs-total').textContent = data.total_sessions ?? 0;
                document.getElementById('logs-latest').textContent = data.latest_session || 'None';
                document.getElementById('logs-dir').textContent = data.logs_directory || '';
            } catch (e) {}
        }
        async function downloadLogs() {
            const s = document.getElementById('logs-status');
            try {
                const res = await fetch('/backend/api/download-session-logs');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'session_logs.zip'; document.body.appendChild(a); a.click(); a.remove(); window.URL.revokeObjectURL(url);
                show(s, 'Logs downloaded.');
            } catch (e) { show(s, 'Download failed: ' + e.message, false); }
        }
        function setActive(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
            document.getElementById('tabbtn-' + tab).classList.add('active');
            document.getElementById('panel-' + tab).style.display = 'block';
            if (tab === 'database') initDatabaseTab();
            if (tab === 'logs') initLogsTab();
        }
        document.addEventListener('DOMContentLoaded', () => setActive('database'));
    </script>
    <script src="/static/js/darkmode.js"></script>
    <script src="/static/js/iframe-darkmode.js"></script>
</head>
<body>
    <div class="settings-container">
        <div class="tabs">
            <h2>Settings</h2>
            <button id="tabbtn-database" class="tab-btn" onclick="setActive('database')">Database</button>
            <button id="tabbtn-metrics" class="tab-btn" onclick="setActive('metrics')">Metrics</button>
            <button id="tabbtn-logs" class="tab-btn" onclick="setActive('logs')">Logs</button>
        </div>
        <div class="panel">
            <div id="panel-database" class="tab-panel">
                <h3>Database</h3>
                <div class="card info">
                    <div>Status: <span id="db-status">Loading...</span></div>
                    <div>Size: <span id="db-size">Loading...</span></div>
                    <div>Last Backup: <span id="db-last-backup">Loading...</span></div>
                </div>
                <div class="card">
                    <div class="row">
                        <button class="btn primary" onclick="createBackup()">Create & Download Backup</button>
                        <span id="db-backup-status" class="status"></span>
                    </div>
                </div>
                <div class="card">
                    <div class="row">
                        <label for="db-restore" id="db-file-label" class="file">Choose Backup File</label>
                        <input id="db-restore" type="file" accept=".sql,.gz,.tar,.zip" onchange="onPickDbRestore(this)">
                        <button class="btn danger" onclick="restoreDatabase()">Restore Database</button>
                    </div>
                    <div id="db-restore-status" class="status"></div>
                </div>
            </div>
            <div id="panel-metrics" class="tab-panel" style="display:none">
                <h3>Metrics</h3>
                <div class="card">
                    <div class="row">
                        <button class="btn primary" onclick="backupMetrics()">Backup Metrics</button>
                        <span id="metrics-backup-status" class="status"></span>
                    </div>
                </div>
                <div class="card">
                    <div class="row">
                        <label for="metrics-restore" id="metrics-file-label" class="file">Choose Metrics Backup File</label>
                        <input id="metrics-restore" type="file" accept=".sql,.gz,.tar,.zip" onchange="onPickMetricsRestore(this)">
                        <button class="btn danger" onclick="restoreMetrics()">Restore Metrics</button>
                    </div>
                    <div id="metrics-restore-status" class="status"></div>
                </div>
            </div>
            <div id="panel-logs" class="tab-panel" style="display:none">
                <h3>Logs</h3>
                <div class="card info">
                    <div>Total Sessions: <span id="logs-total">Loading...</span></div>
                    <div>Latest Session: <span id="logs-latest">Loading...</span></div>
                    <div>Logs Directory: <span id="logs-dir">Loading...</span></div>
                </div>
                <div class="card">
                    <div class="row">
                        <button class="btn secondary" onclick="initLogsTab()">Refresh</button>
                        <button class="btn primary" onclick="downloadLogs()">Download All Session Logs</button>
                    </div>
                    <div id="logs-status" class="status"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
