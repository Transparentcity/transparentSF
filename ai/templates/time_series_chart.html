<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">San Francisco Data | TransparentSF</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    
    <!-- Google Analytics Tracking -->
    {% include 'ga_tracking.html' %}

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Plotly.js for visualizations -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        :root {
            --spruce-green: #4A7463;
            --soft-sand: #F6F1EA;
            --warm-coral: #FF6B5A;
            --sky-blue: #71B2CA;
            --ink-black: #222222;
            --accent-color: #ad35fa;
            --accent-hover: #9625e0;
        }
        
        [data-theme="dark"] {
            --accent-color: #c44dff;
            --accent-hover: #ad35fa;
        }
        
        body {
            font-family: 'IBM Plex Sans', Arial, sans-serif;
            color: var(--ink-black);
            background-color: white;
            padding: 20px; /* Default padding for full view */
            font-size: 14px;
        }
        
        /* Remove padding in chart-section-mode (embedded) */
        body.chart-section-mode {
            padding: 0;
        }
        
        [data-theme="dark"] body {
            background-color: #1a1a1a;
            color: #ffffff;
        }
        
        .chart-container {
            background-color: white;
            border-radius: 4px;
            padding: 16px;
            margin: 0 auto;
            box-shadow: none;
            max-width: 100%;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        
        /* In chart-section-mode (embedded), limit width */
        body.chart-section-mode .chart-container {
            max-width: 600px;
            margin: 0;
        }
        
        [data-theme="dark"] .chart-container {
            background-color: #1a1a1a;
            overflow: visible;
            position: relative;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }
        
        /* In chart-section-mode (embedded), limit dark mode width */
        [data-theme="dark"] body.chart-section-mode .chart-container {
            max-width: 600px;
        }
        
        .header {
            color: var(--accent-color);
            margin-bottom: 16px;
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 250px;
            color: var(--spruce-green);
        }
        
        .error-message {
            color: var(--warm-coral);
            padding: 12px;
            background-color: rgba(255, 107, 90, 0.1);
            border-radius: 5px;
            font-size: 0.9rem;
        }
        
        .metadata {
            background-color: rgba(173, 53, 250, 0.05);
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            border: 1px solid rgba(173, 53, 250, 0.1);
        }
        
        /* Dark mode support for metadata */
        [data-theme="dark"] .metadata {
            background-color: rgba(196, 77, 255, 0.08);
            color: #ffffff;
            border-color: rgba(196, 77, 255, 0.15);
        }
        
        .chart-caption {
            font-size: 11px;
            padding: 6px;
            background-color: rgba(246, 241, 234, 0.7);
            border-radius: 4px;
            margin-top: 8px;
        }
        
        .badge {
            background-color: var(--accent-color);
            color: white;
            font-weight: normal;
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
        }
        
        /* Multi-series chart layout in full view */
        .chart-container.multi-series-layout {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 100%; /* Allow chart to use full width */
            width: 100%;
            margin: 0; /* Remove auto centering for multi-series */
        }
        
        .chart-container.multi-series-layout .chart-wrapper {
            flex: 1 1 auto;
            min-width: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .chart-container.multi-series-layout #time-series-chart {
            width: 100%;
            height: 100%;
            min-height: 500px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        
        .chart-container.multi-series-layout #time-series-plot {
            width: 100% !important;
            height: 100% !important;
        }
        
        .chart-legend-container {
            width: 100%;
            padding: 16px;
            background-color: rgba(246, 241, 234, 0.5);
            border-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            margin-top: 8px;
        }
        
        .chart-container.multi-series-layout .chart-legend-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        [data-theme="dark"] .chart-legend-container {
            background-color: rgba(196, 77, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        .chart-legend-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--ink-black);
            font-family: 'IBM Plex Sans', Arial, sans-serif;
        }
        
        [data-theme="dark"] .chart-legend-title {
            color: #ffffff;
        }
        
        .chart-legend-items {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }
        
        .chart-legend-item {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        
        .chart-legend-item:hover {
            background-color: rgba(173, 53, 250, 0.1);
        }
        
        [data-theme="dark"] .chart-legend-item:hover {
            background-color: rgba(196, 77, 255, 0.15);
        }
        
        .chart-legend-item input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--accent-color);
            flex-shrink: 0;
        }
        
        .chart-legend-item label {
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            color: var(--ink-black);
            font-family: 'IBM Plex Sans', Arial, sans-serif;
            user-select: none;
            line-height: 1.2;
        }
        
        [data-theme="dark"] .chart-legend-item label {
            color: #ffffff;
        }
        
        .chart-legend-color {
            width: 20px;
            height: 3px;
            margin-right: 8px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        
        .chart-legend-item.disabled {
            opacity: 0.4;
        }
        
        @media (max-width: 992px) {
            .chart-legend-items {
                gap: 12px;
            }
            
            .chart-legend-item {
                padding: 4px 8px;
                font-size: 0.8rem;
            }
        }
        
        #time-series-chart {
            width: 100%;
            height: 0;
            padding-bottom: 75%; /* Changed from 100% to 75% for better fit in 437x437 window */
            position: relative;
            overflow: visible;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        
        #time-series-plot {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
        
        /* In embedded mode, ensure plot is properly positioned */
        body.chart-section-mode #time-series-plot {
            position: relative;
            width: 100% !important;
            height: 100% !important;
        }
        
        /* Ensure Plotly elements are responsive */
        .js-plotly-plot, .plot-container {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px;
        }
        
        .main-svg {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
        }
        
        /* Responsive adjustments */
        @media (max-width: 576px) {
            body:not(.chart-section-mode) {
                padding: 15px;
            }
            
            .container {
                padding-left: 15px;
                padding-right: 15px;
            }
            
            .chart-container {
                padding: 12px;
            }
            
            .metadata {
                padding: 10px;
            }
            
            .mt-3.d-flex {
                flex-direction: column;
            }
            
            .mt-3.d-flex .btn {
                margin: 5px 0;
                width: 100%;
            }
            
            #time-series-chart {
                padding-bottom: 70%; /* Slightly shorter for mobile */
            }
        }
        
        /* Add media query for wider screens */
        @media (min-width: 768px) {
            #time-series-chart {
                padding-bottom: 75%; /* Maintain 4:3 aspect ratio on wider screens */
            }
        }
        
        @media (min-width: 1200px) {
            #time-series-chart {
                padding-bottom: 75%; /* Maintain 4:3 aspect ratio on very wide screens */
            }
        }
        
        /* Special handling for small embedded windows */
        @media (max-height: 500px) {
            #time-series-chart {
                padding-bottom: 60%; /* Even shorter for very small height windows */
            }
            
            .chart-container {
                padding: 5px;
            }
        }
        
        /* Special handling for very small embedded windows (like 437x437) */
        @media (max-width: 450px) and (max-height: 450px) {
            #time-series-chart {
                padding-bottom: 55%; /* Even more compact for very small windows */
            }
            
            .chart-container {
                padding: 3px;
                max-width: 100%;
            }
            
            body:not(.chart-section-mode) {
                padding: 10px;
            }
        }
        
        /* Embedded mode optimizations - much more aggressive spacing reduction */
        body.embedded-mode #time-series-chart {
            padding-bottom: 30% !important; /* Much more aggressive for embedded */
        }
        
        /* When embedded in fixed-height iframe, adjust body to fit better */
        body.embedded-mode {
            margin: 0 !important;
            padding: 2px !important;
            overflow: hidden;
        }
        
        body.embedded-mode .chart-container {
            margin: 0 !important;
            padding: 2px !important;
        }
        
        body.embedded-mode #chart-section {
            margin: 0 !important;
        }
        
        body.embedded-mode #datasf-link {
            text-align: left !important;
        }
        
        /* Force left alignment for all centering elements in embedded mode */
        body.embedded-mode .loading {
            justify-content: flex-start !important;
        }
        
        body.embedded-mode .js-plotly-plot,
        body.embedded-mode .plot-container {
            justify-content: flex-start !important;
        }
        
        /* For very large fixed-height iframes (like 600px), still be aggressive */
        @media (min-height: 500px) {
            body.embedded-mode #time-series-chart {
                padding-bottom: 35% !important; /* Still aggressive even for tall iframes */
            }
        }
        
        @media (max-width: 576px) {
            body.embedded-mode #time-series-chart {
                padding-bottom: 28% !important; /* More aggressive for small embedded */
            }
        }
        
        @media (max-width: 450px) and (max-height: 450px) {
            body.embedded-mode #time-series-chart {
                padding-bottom: 25% !important; /* Very aggressive for tiny embedded */
            }
        }
        
        /* Ensure framing elements scale properly with container size */
        .chart-container {
            position: relative;
            overflow: visible;
        }
        
        /* Override framing size for very small containers */
        @media (max-width: 300px) {
            .chart-container::before,
            .chart-container::after {
                width: 50% !important;
                height: 50% !important;
            }
        }
        
        /* Improved group filter styling */
        .group-filter-container {
            background: linear-gradient(135deg, rgba(246, 241, 234, 0.8) 0%, rgba(255, 255, 255, 0.9) 100%);
            border: 1px solid rgba(74, 116, 99, 0.2);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        /* Dark mode support for group filter */
        [data-theme="dark"] .group-filter-container {
            background: linear-gradient(135deg, rgba(30, 30, 30, 0.8) 0%, rgba(45, 45, 45, 0.9) 100%);
            border: 1px solid rgba(74, 116, 99, 0.4);
            color: #ffffff;
        }
        
        [data-theme="dark"] .group-filter-container .form-check-label {
            color: #ffffff;
        }
        
        [data-theme="dark"] .group-filter-container .badge {
            background-color: #4A7463 !important;
            color: #ffffff !important;
        }
        
        [data-theme="dark"] .group-filter-container .btn {
            color: #ffffff;
        }
        
        [data-theme="dark"] .group-filter-container .btn-outline-primary {
            border-color: #4A7463;
            color: #4A7463;
        }
        
        [data-theme="dark"] .group-filter-container .btn-outline-primary:hover {
            background-color: #4A7463;
            color: #ffffff;
        }
        
        [data-theme="dark"] .group-filter-container .btn-outline-secondary {
            border-color: #6c757d;
            color: #6c757d;
        }
        
        [data-theme="dark"] .group-filter-container .btn-outline-secondary:hover {
            background-color: #6c757d;
            color: #ffffff;
        }
        
        [data-theme="dark"] .group-filter-container .btn-primary {
            background-color: #4A7463;
            border-color: #4A7463;
        }
        
        [data-theme="dark"] .group-filter-container .btn-primary:hover {
            background-color: #3a5d4e;
            border-color: #3a5d4e;
        }
        
        [data-theme="dark"] .group-filter-container .text-muted {
            color: #adb5bd !important;
        }
        
        [data-theme="dark"] .group-checkbox-container:hover {
            background-color: rgba(74, 116, 99, 0.2);
        }
        
        /* Dark mode support for alerts */
        [data-theme="dark"] .alert-warning {
            background-color: rgba(255, 193, 7, 0.2);
            border-color: #ffc107;
            color: #ffffff;
        }
        
        [data-theme="dark"] .alert-warning .btn-close {
            filter: invert(1);
        }
        
        .group-checkbox-container {
            transition: all 0.2s ease-in-out;
        }
        
        .group-checkbox-container:hover {
            background-color: rgba(74, 116, 99, 0.05);
            border-radius: 4px;
            padding: 2px;
        }
        
        .form-check-input:checked {
            background-color: var(--spruce-green);
            border-color: var(--spruce-green);
        }
        
        .form-check-input:focus {
            box-shadow: 0 0 0 0.2rem rgba(74, 116, 99, 0.25);
        }
        
        .btn-group .btn {
            border-radius: 4px !important;
        }
        
        .btn-group .btn:first-child {
            border-top-right-radius: 0 !important;
            border-bottom-right-radius: 0 !important;
        }
        
        .btn-group .btn:last-child {
            border-top-left-radius: 0 !important;
            border-bottom-left-radius: 0 !important;
        }
        
        /* Responsive improvements for group filters */
        @media (max-width: 768px) {
            .group-filter-container .btn-group {
                flex-direction: column;
                width: 100%;
            }
            
            .group-filter-container .btn-group .btn {
                border-radius: 4px !important;
                margin-bottom: 2px;
            }
            
            .group-filter-container .d-flex {
                flex-direction: column;
            }
            
            .group-filter-container .d-flex .btn {
                margin-bottom: 5px;
            }
        }
        
        /* Ensure the container takes full height in chart section mode */
        body.chart-section-mode {
            margin: 0;
            padding: 0;
            height: auto;
            min-height: auto;
            background-color: transparent;
            overflow: hidden;
        }
        
        body.chart-section-mode .container {
            padding: 0;
            margin: 0;
            width: 100%;
            max-width: none;
            height: auto;
        }
        
        /* Container defaults for full view mode */
        .container {
            max-width: 1200px !important;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }
        
        /* Remove Bootstrap container constraints in chart-section-mode to allow full width */
        body.chart-section-mode .container {
            max-width: none !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
            margin: 0;
        }
        
        body.chart-section-mode .row,
        body.chart-section-mode .col-12 {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        /* Ensure the modebar is hidden with CSS as well */
        .modebar {
            display: none !important;
        }
        
        /* Attribution line styling */
        .chart-attribution {
            transition: opacity 0.2s ease-in-out;
        }
        
        .chart-attribution:hover {
            opacity: 1;
        }
        
        /* Responsive attribution for small screens */
        @media (max-width: 450px) {
            .chart-attribution {
                font-size: 9px !important;
                padding: 2px 6px !important;
            }
            
            .chart-attribution a {
                font-size: 9px !important;
            }
            
            .chart-attribution i {
                font-size: 7px !important;
            }
        }
        
        /* Dark mode support for attribution */
        [data-theme="dark"] .chart-attribution {
            background-color: rgba(30, 30, 30, 0.9) !important;
            color: #cccccc !important;
        }
        
        [data-theme="dark"] .chart-attribution a {
            color: #cccccc !important;
        }
        
        /* YTD Chart legend styling */
        .ytd-legend {
            font-family: 'IBM Plex Sans', Arial, sans-serif !important;
        }
        
        /* Responsive legend for small screens */
        @media (max-width: 450px) {
            .ytd-legend {
                font-size: 8px !important;
            }
        }
    </style>

    <!-- Dark Mode CSS - embedded for reliability -->
    <style>
        /* Core dark mode variables and styles embedded for reliability */
        :root {
            --text-primary: #222222;
            --text-secondary: #666666;
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --border-primary: #e5e7eb;
            --bright-purple: #ad35fa;
        }
        
        [data-theme="dark"] {
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --border-primary: #404040;
        }
        
        /* Additional dark mode styles for charts */
        [data-theme="dark"] .metadata {
            background-color: rgba(45, 45, 45, 0.8) !important;
            color: #ffffff !important;
        }
        
        [data-theme="dark"] .group-filter-container {
            background: linear-gradient(135deg, rgba(45, 45, 45, 0.8) 0%, rgba(60, 60, 60, 0.9) 100%) !important;
            border: 1px solid rgba(74, 116, 99, 0.4) !important;
            color: #ffffff !important;
        }
        
        [data-theme="dark"] .alert-warning {
            background-color: rgba(255, 193, 7, 0.2) !important;
            border-color: #ffc107 !important;
            color: #ffffff !important;
        }
    </style>
    
    <!-- Fallback: load external CSS if available -->
    <link rel="stylesheet" href="/static/darkmode.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1 class="header" id="page-header">San Francisco Data</h1>
                
                <!-- Metadata will be displayed here -->
                <div id="metadata" class="metadata"></div>
                
                <!-- Chart container -->
                <div id="chart-section" class="chart-container">
                    <div id="loading" class="loading">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                    <div id="error-message" class="error-message" style="display: none;"></div>
                    <div class="chart-wrapper">
                        <div id="time-series-chart"></div>
                    </div>
                    <div id="chart-legend-container" class="chart-legend-container" style="display: none;"></div>
                    <div id="datasf-link" class="mt-3" style="text-align: center;"></div>
                </div>
                
                <div class="mt-3 d-flex justify-content-between flex-column flex-sm-row">
                    <a href="javascript:history.back()" class="btn btn-outline-secondary mb-2 mb-sm-0">Back</a>
                    <div class="d-flex flex-column flex-sm-row">
                        <button id="share-btn" class="btn btn-outline-success mb-2 mb-sm-0 me-sm-2" onclick="copyShareLink()">
                            <i class="fas fa-share-alt me-1"></i> Share
                        </button>
                        <button id="embed-btn" class="btn btn-outline-primary" onclick="showEmbedCode()">
                            <i class="fas fa-code me-1"></i> Embed
                        </button>
                    </div>
                </div>
                
                <!-- Embed code modal -->
                <div class="modal fade" id="embedModal" tabindex="-1" aria-labelledby="embedModalLabel" inert>
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="embedModalLabel">Embed Chart</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <p>Copy and paste this code into your website or article:</p>
                                <div class="input-group mb-3">
                                    <textarea id="embedCode" class="form-control" rows="3" readonly></textarea>
                                    <button class="btn btn-outline-primary" type="button" onclick="copyEmbedCode()">
                                        <i class="fas fa-copy"></i>
                                    </button>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="responsiveCheck" checked>
                                    <label class="form-check-label" for="responsiveCheck">
                                        Make responsive
                                    </label>
                                </div>
                                <div class="form-group mb-3">
                                    <label for="widthInput">Width:</label>
                                    <input type="text" class="form-control" id="widthInput" value="100%">
                                </div>
                                <div class="form-group mb-3">
                                    <label for="heightInput">Height:</label>
                                    <input type="text" class="form-control" id="heightInput" value="600px">
                                </div>
                                <button class="btn btn-primary" onclick="updateEmbedCode()">Update Code</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Get parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const chartId = urlParams.get('chart_id');
        const metricId = urlParams.get('metric_id');
        const district = urlParams.get('district') || '0';
        const periodType = urlParams.get('period_type') || 'month';
        const groups = urlParams.get('groups'); // Get groups parameter from URL
        const groupField = urlParams.get('group_field'); // Get group_field parameter from URL

            // Function to update the chart aspect ratio and maintain responsive shape
            function updateChartAspectRatio() {

                if (!chartContainer || !timeSeriesChart || !plotElement) return;

                    const bodyElement = document.body;
                    
                    if (parentElement && parentElement !== bodyElement) {

        // Function to create and display caption
        function createCaption(metadata) {
            // Remove any existing caption element
            const existingCaption = document.querySelector('.chart-caption');
            if (existingCaption) {
                existingCaption.remove();
            }
            
            // Extract caption from metadata - check multiple possible fields
            const captionText = metadata.caption || 
                              metadata.notes || 
                              metadata.description || 
                              metadata.chart_description || 
                              metadata.chart_caption || '';
            
            console.log('Creating caption - fullView:', fullView, 'captionText:', captionText ? captionText.substring(0, 100) + '...' : 'none');
            
            // Only create caption if we have text
            if (!captionText || captionText.trim() === '') {
                console.log('No caption text found in metadata');
                return;
            }
            
            // Get the chart section container
            const chartSection = document.getElementById('chart-section');
            if (!chartSection) {
                return;
            }
            
            // Create caption element
            const captionDiv = document.createElement('div');
            captionDiv.className = 'chart-caption';
            // Use innerHTML to support HTML tags like <br>, <strong>, <em>, etc.
            // Also normalize <BR> to <br> for consistency
            const normalizedCaption = captionText.trim().replace(/<BR>/gi, '<br>');
            captionDiv.innerHTML = normalizedCaption;
            
            // Insert caption after the chart-section div (before the buttons)
            // This ensures it doesn't overlap with the back button
            if (chartSection.parentNode) {
                // Insert after chart-section but before the buttons div
                const buttonsDiv = chartSection.nextElementSibling;
                if (buttonsDiv && buttonsDiv.classList.contains('mt-3')) {
                    // Insert before buttons
                    chartSection.parentNode.insertBefore(captionDiv, buttonsDiv);
                } else {
                    // Fallback: insert after chart-section
                    chartSection.parentNode.insertBefore(captionDiv, chartSection.nextSibling);
                }
            } else {
                // Last resort: append to chart section
                chartSection.appendChild(captionDiv);
            }
            
            // Show caption in full view mode, hide in embedded mode
            if (!fullView) {
                captionDiv.style.display = 'none';
            } else {
                captionDiv.style.display = 'block';
            }
        }
        
        // Function to calculate mean
        function calculateMean(values) {
            const sum = values.reduce((acc, val) => acc + val, 0);
            return sum / values.length;
        }
        
        // Function to calculate standard deviation
        function calculateStandardDeviation(values, mean) {
            const squareDiffs = values.map(value => {
                const diff = value - mean;
                return diff * diff;
            });
            
            const avgSquareDiff = calculateMean(squareDiffs);
            return Math.sqrt(avgSquareDiff);
        }

                title += ` ${districtName}`;
            }
            
            // Add the latest period
            if (latestPeriod) {
                title += ` ${latestPeriod}`;
            }

        // Function to fetch time series data
        async function fetchTimeSeriesData() {
            try {
                // Show loading indicator
                showLoading();
                
                let apiUrl;
                
                // If chart_id is provided, use the direct chart endpoint
                if (chartId) {
                    apiUrl = `/api/chart/${chartId}`;
                    console.log(`Fetching time series data by chart_id with URL: ${apiUrl}`);
                } 
                // Otherwise use the metric-based endpoint (backward compatibility)
                else if (metricId) {
                    // Construct API URL with all parameters
                    apiUrl = `/api/chart-by-metric?metric_id=${metricId}&district=${district}&period_type=${periodType}`;
                    
                    // Add groups parameter if present
                    if (groups !== null && groups !== undefined) {
                        apiUrl += `&groups=${encodeURIComponent(groups)}`;
                    }
                    
                    // Add group_field parameter if present
                    if (groupField) {
                        apiUrl += `&group_field=${encodeURIComponent(groupField)}`;
                    }
                    
                    console.log(`Fetching time series data by metric_id with URL: ${apiUrl}`);
                } else {
                    showError('No chart_id or metric_id provided. Please specify either parameter in the URL.');
                    return;
                }
                
                // Fetch time series data
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch time series data: ${response.status} ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log("Received data:", data);
                
                if (data.status === 'error') {
                    throw new Error(data.message || 'Failed to load time series data');
                }
                
                // Render the chart
                renderTimeSeriesChart(data);
                
            } catch (error) {
                console.error('Error fetching time series data:', error);
                hideLoading();
                showError(`Error loading time series data: ${error.message}`);
            }
        }

                // Remove hash immediately to prevent auto-scrolling
                history.replaceState(null, null, window.location.pathname + window.location.search);

        function copyShareLink() {
            const url = window.location.href;
            const shareBtn = document.getElementById('share-btn');
            const originalText = shareBtn.innerHTML;
            
            const tryClipboardCopy = () => {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(url);
                } else {
                    // Fallback for older browsers or insecure contexts
                    return new Promise((resolve, reject) => {
                        const textArea = document.createElement('textarea');
                        textArea.value = url;
                        textArea.style.position = 'fixed';
                        textArea.style.left = '-999999px';
                        textArea.style.top = '-999999px';
                        document.body.appendChild(textArea);
                        if (window.location === window.parent.location) textArea.focus();
                        textArea.select();
                        try {
                            const result = document.execCommand('copy');
                            document.body.removeChild(textArea);
                            if (result) {
                                resolve();
                            } else {
                                reject(new Error('execCommand failed'));
                            }
                        } catch (err) {
                            document.body.removeChild(textArea);
                            reject(err);
                        }
                    });
                }
            };
            
            tryClipboardCopy().then(() => {
                // Change button text to indicate success
                shareBtn.innerHTML = '<i class="fas fa-check me-1"></i> Copied!';
                shareBtn.classList.remove('btn-outline-success');

                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                // Show URL in prompt as fallback
                const userUrl = prompt('Copy this URL:', url);

                    // User interacted with the prompt, show temporary feedback

                    }, 2000);

            });

        // Function to apply theme colors to Plotly chart
        function applyThemeToPlot(theme) {
            const isDark = theme === 'dark';

            const textColor = styles.getPropertyValue('--text-primary').trim() || (isDark ? '#ffffff' : '#222222');
            const gridColor = isDark ? 'rgba(60,60,60,0.5)' : 'rgba(232, 233, 235, 0.5)';
            const borderColor = styles.getPropertyValue('--border-primary').trim() || gridColor;
            
            // Use fully opaque backgrounds to prevent white bleeding through

            const plotElement = document.getElementById('time-series-plot');

                Plotly.relayout(plotElement, {

                    'legend.font.color': textColor,
                    'title.font.color': textColor,
                    'paper_bgcolor': paperBg,
                    'plot_bgcolor': plotBg
                });
            }
        }

        // Listen for dark-mode changes dispatched by DarkModeManager

        (function() {
            'use strict';
            
            let currentTheme = null;
            let systemListener = null;
            
            // Function to apply theme
            function applyTheme(theme) {
                if (currentTheme === theme) return;
                
                currentTheme = theme;
                document.documentElement.setAttribute('data-theme', theme);
                
                // Update any toggle buttons if they exist
                const toggles = document.querySelectorAll('.dark-mode-toggle');
                toggles.forEach(toggle => {
                    const icon = toggle.querySelector('.icon');
                    if (icon) {
                        icon.textContent = theme === 'light' ? '🌙' : '☀️';
                    }
                });
                
                // Update logo based on theme
                const logoImages = document.querySelectorAll('#wordmark-logo, img[src*="wordmark.png"]');
                logoImages.forEach(img => {
                    if (theme === 'dark') {
                        img.src = '/static/darkwordmark.png';
                    } else {
                        img.src = '/static/wordmark.png';
                    }
                });
                
                // Dispatch theme change event for chart updates
                window.dispatchEvent(new CustomEvent('themeChanged', { detail: { theme } }));
                
                console.log('Chart dark mode: Applied theme:', theme);
            }
            
            // Get current theme preference
            function getCurrentTheme() {
                // Always check system preference first for charts
                const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                console.log('Chart dark mode: System prefers dark:', systemPrefersDark);
                
                // Check stored preference
                let stored = null;
                try {
                    stored = localStorage.getItem('theme');
                    console.log('Chart dark mode: Stored theme:', stored);
                } catch (e) {
                    console.log('Chart dark mode: localStorage not available');
                }
                
                // For embedded charts, always use system preference unless explicitly overridden
                const isEmbedded = window.location !== window.parent.location;
                if (isEmbedded || !stored) {
                    const theme = systemPrefersDark ? 'dark' : 'light';
                    console.log('Chart dark mode: Using system theme for embedded/new chart:', theme);
                    try {
                        localStorage.setItem('theme', theme);
                    } catch (e) {}
                    return theme;
                }
                
                console.log('Chart dark mode: Using stored theme:', stored);
                return stored;
            }
            
            // Add system theme change listener
            function addSystemListener() {
                if (systemListener || !window.matchMedia) return;
                
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                
                systemListener = function(e) {
                    console.log('Chart dark mode: System theme changed to:', e.matches ? 'dark' : 'light');
                    const newTheme = e.matches ? 'dark' : 'light';
                    
                    if (currentTheme !== newTheme) {
                        applyTheme(newTheme);
                        try {
                            localStorage.setItem('theme', newTheme);
                        } catch (e) {}
                    }
                };
                
                // Add listener with both modern and legacy methods
                if (mediaQuery.addEventListener) {
                    mediaQuery.addEventListener('change', systemListener);
                } else {
                    mediaQuery.addListener(systemListener);
                }
                
                console.log('Chart dark mode: System theme listener added');
            }
            
            // Initialize dark mode
            function initDarkMode() {
                console.log('Chart dark mode: Initializing...');
                
                // Apply current theme
                const theme = getCurrentTheme();
                applyTheme(theme);
                
                // Add system listener
                addSystemListener();
                
                console.log('Chart dark mode: Initialization complete with theme:', theme);
            }
            
            // Initialize when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initDarkMode);
            } else {
                initDarkMode();
            }
            
        })();
    </script>
    
    <!-- Load main dark mode script only for non-embedded contexts -->
    <script>
        if (window.location === window.parent.location) {
            // Not in iframe, load main dark mode script
            const script = document.createElement('script');
            script.src = '/static/js/darkmode.js';
            document.head.appendChild(script);
        }
    </script>
</body>
