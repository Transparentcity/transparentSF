        // Show streaming interface for running writeups
        function showStreamingInterface(session) {
            const streamingDisplay = document.getElementById('streamingDisplay');
            const streamingTitle = document.getElementById('streamingTitle');
            const streamingStatus = document.getElementById('streamingStatus');
            
            streamingTitle.textContent = session.title;
            streamingStatus.textContent = session.progress || 'Processing...';
            
            // Initialize conversation renderer if not already done
            if (!window.writeupConversationRenderer) {
                try {
                    window.writeupConversationRenderer = new ConversationRenderer('conversationRenderer', {
                        showTimestamps: false,
                        enableMarkdown: true,
                        enableToolCallDetails: true,
                        enableChartProcessing: true,
                        autoScroll: true
                    });
                } catch (error) {
                    console.error('Error creating ConversationRenderer:', error);
                    streamingStatus.textContent = 'Error: Failed to initialize conversation renderer';
                return;
                }
            }
            
            // Add initial user message if not already added
            if (session.originalPrompt && !session.conversationStarted) {
                window.writeupConversationRenderer.addMessage(session.originalPrompt, 'user', false);
                session.conversationStarted = true;
            }
            
            // Load conversation if we have a session ID
            if (session.sessionId) {
                loadConversationViewer(session.sessionId);
            }
            
            streamingDisplay.style.display = 'flex';
        }
        
        // Load conversation viewer for a specific session
        async function loadConversationViewer(sessionId) {
            try {
                const response = await fetch(`/backend/conversation?session=${sessionId}`);
                const html = await response.text();
                
                // Extract the conversation content from the response
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const conversationContainer = doc.querySelector('#conversationContainer');
                
                if (conversationContainer) {
                    const conversationRenderer = document.getElementById('conversationRenderer');
                    if (conversationRenderer) {
                        conversationRenderer.innerHTML = conversationContainer.innerHTML;
                        
                        // Re-initialize the conversation renderer with the loaded content
                        if (window.writeupConversationRenderer) {
                            window.writeupConversationRenderer.refresh();
                        }
                    }
                }
            } catch (error) {
                console.error('Error loading conversation viewer:', error);
                const conversationRenderer = document.getElementById('conversationRenderer');
                if (conversationRenderer) {
                    conversationRenderer.innerHTML = `
                        <div class="conversation-message">
                            <div class="message-content">Error loading conversation: ${error.message}</div>
                        </div>
                    `;
                }
            }
        }
        
        // Start monitoring conversation for streaming updates
        function startConversationMonitoring(sessionId) {
            const key = `conversation-monitor-${sessionId}`;
            
            // Clear any existing monitoring for this session
            pollingManager.clearPolling(key);
            
            // Poll for conversation updates every 5 seconds (reduced from 2s)
            const pollInterval = pollingManager.createInterval(async () => {
                try {
                    const response = await fetch(`/backend/conversation?session=${sessionId}`);
                    const html = await response.text();
                    
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const conversationContainer = doc.querySelector('#conversationContainer');
                    
                    if (conversationContainer) {
                        const conversationRenderer = document.getElementById('conversationRenderer');
                        if (conversationRenderer) {
                            conversationRenderer.innerHTML = conversationContainer.innerHTML;
                            
                            // Re-initialize the conversation renderer with the updated content
                            if (window.writeupConversationRenderer) {
                                window.writeupConversationRenderer.refresh();
                            }
                        }
                    }
                    
                    // Check if the session is still running
                    const session = sessions.get(currentSessionId);
                    if (session && (session.status === 'completed' || session.status === 'failed')) {
                        pollingManager.clearPolling(key);
                    }
                } catch (error) {
                    console.error('Error monitoring conversation:', error);
                }
            }, 5000, key); // Reduced from 2s to 5s
        }
        
        
        // Load existing writeups from database
        async function loadExistingWriteups(showLoading = true) {
            // Prevent multiple simultaneous loads
            if (isLoadingWriteups) {
                return;
            }
            
            isLoadingWriteups = true;
            if (showLoading) {
                showLoadingIndicator();
            }
            
            try {
                // Use lightweight endpoint for faster loading
                const response = await fetch('/api/writeups/list?lightweight=true');
                const data = await response.json();
                
                if (data.status === 'success') {
                    // Clear existing sessions to avoid duplicates
                    sessions.clear();
                    
                    // Convert existing writeups to sessions
                    data.writeups.forEach(writeup => {
                        const sessionId = `writeup_${writeup.id}`;
                        const promptPreview = writeup.original_prompt ? 
                            (writeup.original_prompt.length > 60 ? writeup.original_prompt.substring(0, 57) + '...' : writeup.original_prompt) : '';
                        const session = {
                            id: sessionId,
                            writeupId: writeup.id,
                            sessionId: writeup.session_id, // Store the actual session ID for conversation viewer
                            title: writeup.title,
                            status: writeup.status === 'completed' ? 'completed' : 
                                   writeup.status === 'failed' ? 'failed' : 
                                   writeup.status === 'in_progress' ? 'running' :
                                   writeup.status === 'running' ? 'running' :
                                   writeup.status,
                            messages: [],
                            progress: '',
                            promptPreview: promptPreview,
                            createdAt: new Date(writeup.created_at),
                            originalPrompt: writeup.original_prompt,
                            finalContent: writeup.final_content,
                            latestStreamingLine: '',
                            modelKey: formatModelName(writeup.model_key)
                        };
                        
                        // For actually running writeups, set streaming info
                        if (writeup.status === 'running' || writeup.status === 'in_progress') {
                            session.latestStreamingLine = 'Generating write-up...';
                        }
                        
                        sessions.set(sessionId, session);
                    });
                    
                    // Also check for active jobs to get more detailed progress
                    await loadActiveJobs();
                    
                    renderSessions();
                }
            } catch (error) {
                console.error('Error loading existing writeups:', error);
                hideLoadingIndicator();
            } finally {
                isLoadingWriteups = false;
            }
        }
        
        // Load active jobs to get detailed progress information
        async function loadActiveJobs() {
            try {
                const response = await fetch('/backend/jobs');
                const data = await response.json();
                
                if (data.status === 'success') {
                    const activeJobs = data.jobs.filter(job => job.status === 'running' || job.status === 'pending');
                    
                    // Update sessions with job progress information
                    activeJobs.forEach(job => {
                        // Try to match job to writeup by description
                        const description = job.description || '';
                        const writeupMatch = description.match(/Execute writeup.*\(ID: (\d+)\)/);
                        
                        if (writeupMatch) {
                            const writeupId = parseInt(writeupMatch[1]);
                            const sessionId = `writeup_${writeupId}`;
                            const session = sessions.get(sessionId);
                            
                            if (session) {
                                // Update session with job progress
                                session.status = job.status === 'running' ? 'running' : 'pending';
                                session.progress = `${job.progress}% - ${job.description || 'Processing...'}`;
                                session.latestStreamingLine = `Job ${job.job_id}: ${job.progress}% complete`;
                                
                                console.log(`Updated session ${sessionId} with job progress: ${job.progress}%`);
                            }
                        }
                    });
                    
                    // Also check for writeups that are in progress but don't have jobs
                    // This handles cases where writeups are running but not tracked by job manager
                    const inProgressWriteups = Array.from(sessions.values()).filter(session => 
                        session.status === 'running' || session.status === 'in_progress'
                    );
                    
                    inProgressWriteups.forEach(session => {
                        if (!session.progress || session.progress === '') {
                            // This writeup is running but doesn't have job progress
                            session.progress = 'Processing...';
                            session.latestStreamingLine = 'Generating write-up...';
                            console.log(`Updated session ${session.id} with fallback progress`);
                        }
                    });
                }
            } catch (error) {
                console.error('Error loading active jobs:', error);
            }
        }

        // Handle sending a new message or executing pending writeup
        async function handleSendMessage() {
            if (isGenerating) return;
            
            const promptTextarea = document.getElementById('promptTextarea');
            const modelSelect = document.getElementById('modelSelect');
            const sendButton = document.getElementById('sendButton');
            const modelKey = modelSelect.value;
            
            isGenerating = true;
            sendButton.disabled = true;
            
            if (currentSessionId) {
                // Check if this is executing a pending writeup
                const session = sessions.get(currentSessionId);
                if (session && session.status === 'pending' && session.writeupId) {
                    sendButton.textContent = 'Executing...';
                    await executePendingWriteup(session.writeupId, modelKey);
                    return;
                }
            }
            
            // Creating a new writeup
            const prompt = promptTextarea.value.trim();
            if (!prompt) {
                isGenerating = false;
                sendButton.disabled = false;
                return;
            }
            
            sendButton.textContent = 'Creating...';
            
            const sessionTitle = createSessionTitle(prompt);
            const promptPreview = prompt.length > 60 ? prompt.substring(0, 57) + '...' : prompt;
            
            // Clear input immediately
            promptTextarea.value = '';
            
            // Create a temporary session immediately with spinner
            const tempSessionId = `temp_${Date.now()}`;
            addSession(tempSessionId, 'Generating title...', 'pending', promptPreview);
            selectSession(tempSessionId);
            
            try {
                const response = await fetch('/api/writeups/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        title: '', // Let the backend generate the title
                        prompt: prompt,
                        output_format: 'html',
                        generate_title: true,
                        model_key: modelKey
                    })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    // Replace the temporary session with the real one
                    const newSessionId = `writeup_${result.writeup_id}`;
                    const generatedTitle = result.title || 'Generating title...';
                    
                    // Remove temp session and add real one
                    sessions.delete(tempSessionId);
                    addSession(newSessionId, generatedTitle, 'pending', promptPreview);
                    sessions.get(newSessionId).writeupId = result.writeup_id;
                    
                    // Select the newly created writeup
                    selectSession(newSessionId);
                    
                    // Start polling for title updates if it's still generating
                    if (generatedTitle === 'Generating title...') {
                        // Wait for title generation to complete before executing
                        sendButton.textContent = 'Generating title...';
                        await waitForTitleGeneration(result.writeup_id, newSessionId);
                    }
                    
                    // Automatically execute the writeup with the selected model
                    sendButton.textContent = 'Executing...';
                    await executePendingWriteup(result.writeup_id, modelKey);
                } else {
                    // Remove temp session on error
                    sessions.delete(tempSessionId);
                    renderSessions();
                    alert(`Error: ${result.message || 'Failed to create write-up'}`);
                }
            } catch (error) {
                // Remove temp session on error
                sessions.delete(tempSessionId);
                renderSessions();
                alert(`Error: ${error.message}`);
            } finally {
                isGenerating = false;
                sendButton.disabled = false;
                sendButton.textContent = 'Generate';
            }
        }
        
        // Execute a pending writeup
        async function executePendingWriteup(writeupId, modelKey) {
            try {
                const response = await fetch(`/api/writeups/${writeupId}/execute`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model_key: modelKey
                    })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    // Update session to running status
                    const sessionId = `writeup_${writeupId}`;
                    updateSession(sessionId, {
                        status: 'running',
                        progress: `Job started: ${result.job_id || 'unknown'}. Executing...`
                    });
                    
                    // Show streaming interface immediately
                    const session = sessions.get(sessionId);
                    if (session) {
                        showStreamingInterface(session);
                    }
                    
                    // Reload writeups periodically to check for completion
                    const key = `writeup-check-${sessionId}`;
                    pollingManager.clearPolling(key);
                    
                    const checkInterval = pollingManager.createInterval(async () => {
                        await loadExistingWriteups();
                        const session = sessions.get(sessionId);
                        if (session && (session.status === 'completed' || session.status === 'failed')) {
                            pollingManager.clearPolling(key);
                            showSessionContent(); // Refresh the display
                        }
                    }, 5000, key); // Reduced from 3s to 5s
                } else {
                    const sessionId = `writeup_${writeupId}`;
                    updateSession(sessionId, {
                        status: 'failed',
                        progress: `Error: ${result.message || 'Failed to execute write-up'}`
                    });
                }
            } catch (error) {
                const sessionId = `writeup_${writeupId}`;
                updateSession(sessionId, {
                    status: 'failed',
                    progress: `Error: ${error.message}`
                });
            } finally {
                isGenerating = false;
                document.getElementById('sendButton').disabled = false;
                document.getElementById('sendButton').textContent = 'Execute Writeup';
            }
        }

        // Delete writeup
        async function deleteWriteup(writeupId) {
            if (!confirm('Are you sure you want to delete this write-up? This action cannot be undone.')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/writeups/${writeupId}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    loadExistingWriteups();
                    
                    // If this was the selected session, clear selection
                    if (currentSessionId === `writeup_${writeupId}`) {
                        showNewWriteup();
                    }
                } else {
                    alert('Error: ' + (result.message || 'Failed to delete write-up'));
                }
            } catch (error) {
                alert('Error deleting write-up: ' + error.message);
            }
        }
        
        // Process chart placeholders in content (reused from explainer agent)
        function processChartPlaceholders(content) {
            if (!content) return content;
            
            // Regular expression to match chart placeholders: [CHART:type:param1:param2:param3]
            const chartRegex = /\[CHART:([^:]+):([^\]]+)\]/g;
            
            return content.replace(chartRegex, (match, chartType, params) => {
                const paramParts = params.split(':');
                
                if (chartType === 'anomaly' || chartType === 'anomaly_id' || chartType === 'anomalyid') {
                    const anomalyId = paramParts[0];
                    return `<div class="chart-container" style="margin: 4px 0;">
                        <iframe src="/anomaly-analyzer/anomaly-chart?id=${anomalyId}" 
                                style="width: 100%; height: 550px; border: none;" 
                                frameborder="0" scrolling="no">
                        </iframe>
                    </div>`;
                } else if (chartType === 'time_series' || chartType === 'time_series_id' || chartType === 'timeseries' || chartType === 'timeseriesid') {
                    if (paramParts.length === 1) {
                        const chartId = paramParts[0];
                        return `<div class="chart-container" style="margin: 4px 0;">
                            <iframe src="/backend/time-series-chart?chart_id=${chartId}&embedded=true" 
                                    style="width: 100%; height: 500px; border: none;" 
                                    frameborder="0" scrolling="no">
                            </iframe>
                        </div>`;
                    } else {
                        const metricId = paramParts[0];
                        const district = paramParts[1] || '0';
                        const period = paramParts[2] || 'month';
                        return `<div class="chart-container" style="margin: 4px 0;">
                            <iframe src="/backend/time-series-chart?metric_id=${metricId}&district=${district}&period_type=${period}&embedded=true" 
                                    style="width: 100%; height: 500px; border: none;" 
                                    frameborder="0" scrolling="no">
                            </iframe>
                        </div>`;
                    }
                } else if (chartType === 'map') {
                    const mapId = paramParts[0];
                    return `<div class="chart-container" style="margin: 4px 0;">
                        <iframe src="/backend/map-chart?id=${mapId}&embedded=true" 
                                style="width: 100%; height: 800px; border: none;" 
                                frameborder="0" scrolling="yes">
                        </iframe>
                    </div>`;
                } else if (chartType === 'dualmap') {
                    const map1Id = paramParts[0];
                    const map2Id = paramParts[1];
                    return `<div class="chart-container" style="margin: 4px 0;">
                        <iframe src="/dual-map?map1_id=${map1Id}&map2_id=${map2Id}" 
                                style="width: 100%; height: 800px; border: none;" 
                                frameborder="0" scrolling="yes">
                        </iframe>
                    </div>`;
                }
                
                return match;
            });
        }
        
        // Dropdown menu functionality
        function toggleSessionMenu(sessionId) {
            // Close all other menus first
            document.querySelectorAll('.session-menu-dropdown').forEach(menu => {
                if (menu.id !== `menu_${sessionId}`) {
                    menu.classList.remove('show');
                }
            });
            
            // Toggle the current menu
            const menu = document.getElementById(`menu_${sessionId}`);
            if (menu) {
                menu.classList.toggle('show');
            }
        }
        
        // Copy writeup URL to clipboard
        async function copyWriteupUrl(writeupId, buttonElement) {
            const url = `${window.location.origin}/api/writeups/permalink/${writeupId}`;
            
            // Get the button element - either passed as parameter or from event
            const button = buttonElement || event.target;
            const originalText = button.textContent;
            
            try {
                // Try modern clipboard API first
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(url);
                    showCopySuccess(button, originalText);
                    return;
                }
                
                // Fallback for older browsers or non-secure contexts
                const textArea = document.createElement('textarea');
                textArea.value = url;
                textArea.style.position = 'fixed';
                textArea.style.left = '-999999px';
                textArea.style.top = '-999999px';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                
                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                
                if (successful) {
                    showCopySuccess(button, originalText);
                } else {
                    throw new Error('execCommand failed');
                }
            } catch (err) {
                console.error('Failed to copy URL:', err);
                showCopyError(button, originalText, url);
            }
        }
        
        // Show copy success feedback
        function showCopySuccess(button, originalText) {
            button.textContent = '✓ Copied!';
            button.style.color = '#28a745';
            setTimeout(() => {
                button.textContent = originalText;
                button.style.color = '';
            }, 1500);
        }
        
        // Show copy error feedback
        function showCopyError(button, originalText, url) {
            button.textContent = '❌ Failed';
            button.style.color = '#dc3545';
            setTimeout(() => {
                button.textContent = originalText;
                button.style.color = '';
            }, 2000);
            
            // Also show a more detailed error message
            setTimeout(() => {
                if (confirm('Failed to copy URL to clipboard. Would you like to see the URL?')) {
                    prompt('Copy this URL:', url);
                }
            }, 100);
        }
        
        // Close all dropdown menus when clicking outside
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.session-menu')) {
                document.querySelectorAll('.session-menu-dropdown').forEach(menu => {
                    menu.classList.remove('show');
                });
            }
        });
    </script>
    
    <!-- Polling Manager -->
    <script src="/static/js/polling-manager.js"></script>
    
    <!-- Dark Mode JavaScript -->
    <script src="/static/js/darkmode.js"></script>
