<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writeups</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <link rel="stylesheet" href="/static/darkmode.css">
    <style>
        :root { --bright-purple:#ad35fa; --border:#e2e8f0; --muted:#64748b; }
        body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin:0; background:#fff; color:#0f172a; }
        .layout { display:flex; height:100vh; }
        .sidebar { width:320px; border-right:1px solid var(--border); display:flex; flex-direction:column; }
        .sidebar-header { padding:12px 14px; border-bottom:1px solid var(--border); font-weight:600; }
        .agents-list { flex:1; overflow:auto; }
        .agent-item { padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer; }
        .agent-item.active { background:#f8fafc; }
        .agent-title { display:flex; align-items:center; gap:8px; font-weight:600; }
        .agent-sub { margin-top:4px; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .spinner { width:14px; height:14px; border:2px solid #e2e8f0; border-top:2px solid var(--bright-purple); border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
        .main { flex:1; display:flex; flex-direction:column; }
        .main-header { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
        .composer { max-width:800px; margin:24px auto; width:100%; border:1px solid var(--border); border-radius:10px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,0.03); }
        .row { display:flex; gap:10px; align-items:center; }
        .row select { padding:8px; border:1px solid var(--border); border-radius:8px; min-width:240px; }
        .prompt { margin-top:10px; }
        .prompt textarea { width:100%; min-height:120px; padding:12px; border:1px solid var(--border); border-radius:8px; resize:vertical; font-family:inherit; font-size:14px; }
        .actions { display:flex; justify-content:flex-end; margin-top:12px; gap:8px; }
        .btn { background:var(--bright-purple); color:#fff; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; }
        .btn:disabled { opacity:.6; cursor:not-allowed; }
        .conversation { flex:1; overflow:auto; padding:16px; }
        .bubble { max-width:800px; margin:0 auto 12px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; }
        .bubble.user { background:#faf5ff; border-color:#eadcff; }
        .bubble.assistant { background:#f8fafc; }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">Agents</div>
            <div id="agentsList" class="agents-list"></div>
        </aside>
        <main class="main">
            <div class="main-header">Writeups</div>
            <div class="composer">
                <div class="row">
                    <select id="modelSelect"><option>Loading models...</option></select>
                </div>
                <div class="prompt">
                    <textarea id="promptInput" placeholder="Describe the writeup you want..." ></textarea>
                </div>
                <div class="actions">
                    <button id="goBtn" class="btn">Go</button>
                </div>
            </div>
            <div id="conversation" class="conversation"></div>
        </main>
    </div>

    <script>
        const agents = new Map(); // id -> {title, logs, sessionId, running}
        let activeAgentId = null;
        let currentReader = null;

        async function loadModels() {
            try {
                const res = await fetch('/backend/available-models');
                const data = await res.json();
                const sel = document.getElementById('modelSelect');
                sel.innerHTML = '';
                if (data.status === 'success') {
                    // default option
                    const def = document.createElement('option');
                    def.value = data.default_model;
                    def.textContent = `Default (${data.default_model})`;
                    sel.appendChild(def);
                    // providers grouped already sorted server-side
                    data.models.forEach(m => {
                        if (!m.available) return;
                        const opt = document.createElement('option');
                        opt.value = m.key; opt.textContent = m.name; sel.appendChild(opt);
                    });
                } else {
                    sel.innerHTML = '<option>Error loading models</option>';
                }
            } catch (e) {
                document.getElementById('modelSelect').innerHTML = '<option>Error loading models</option>';
            }
        }

        function summarizeTitle(text) {
            const t = (text || '').trim().replace(/\s+/g,' ');
            return t.length > 60 ? t.slice(0,57)+'...' : (t || 'New Writeup');
        }

        function renderAgentsList() {
            const list = document.getElementById('agentsList');
            list.innerHTML = '';
            Array.from(agents.values()).sort((a,b)=>b.createdAt-a.createdAt).forEach(agent => {
                const div = document.createElement('div');
                div.className = 'agent-item' + (agent.id===activeAgentId?' active':'');
                div.onclick = () => openAgent(agent.id);
                div.innerHTML = `
                    <div class="agent-title">
                        ${agent.running ? '<span class="spinner"></span>' : ''}
                        <span>${agent.title}</span>
                    </div>
                    <div class="agent-sub">${agent.latestLog || ''}</div>
                `;
                list.appendChild(div);
            });
        }

        function appendBubble(role, content) {
            const c = document.getElementById('conversation');
            const b = document.createElement('div');
            b.className = 'bubble ' + role;
            b.innerHTML = content;
            c.appendChild(b);
            c.scrollTop = c.scrollHeight;
            return b;
        }

        function openAgent(id) {
            activeAgentId = id;
            const c = document.getElementById('conversation');
            c.innerHTML = '';
            const agent = agents.get(id);
            if (!agent) return;
            agent.messages.forEach(m => appendBubble(m.role, m.html));
            renderAgentsList();
        }

        async function startWriteup() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) return;
            const model = document.getElementById('modelSelect').value || undefined;

            // Create agent entry
            const id = crypto.randomUUID();
            const agent = { id, title: summarizeTitle(prompt), running: true, latestLog: 'Starting...', messages: [], createdAt: Date.now(), sessionId: null };
            agents.set(id, agent);
            activeAgentId = id;
            renderAgentsList();

            // Show user message
            agent.messages.push({ role: 'user', html: prompt.replace(/</g,'&lt;') });
            if (activeAgentId === id) appendBubble('user', prompt.replace(/</g,'&lt;'));

            // Kick off streaming to explainer agent endpoint
            const body = {
                prompt,
                model_key: model,
                tool_groups: ['core','analysis','metrics','visualization'],
                session_data: {}
            };

            try {
                const res = await fetch('/backend/api/langchain-explainer-streaming', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                if (!res.ok) throw new Error('Request failed: ' + res.status);
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let assistantBubble = null; let current = '';
                currentReader = reader;
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    for (const line of chunk.split('\n')) {
                        if (!line.startsWith('data: ')) continue;
                        try {
                            const data = JSON.parse(line.slice(6));
                            if (data.session_id && !agent.sessionId) agent.sessionId = data.session_id;
                            if (data.tool_call_start) { agent.latestLog = data.tool_call_start; renderAgentsList(); continue; }
                            if (data.tool_call_args) { agent.latestLog = 'Running...'; renderAgentsList(); continue; }
                            if (data.tool_call_complete) { agent.latestLog = 'Completed: ' + (data.success ? 'ok' : 'error'); renderAgentsList(); continue; }
                            if (data.content) {
                                if (!assistantBubble) {
                                    assistantBubble = { el: appendBubble('assistant', '' ) };
                                    agent.messages.push({ role: 'assistant', html: '' });
                                }
                                current += data.content;
                                const safe = current.replace(/</g,'&lt;');
                                assistantBubble.el.innerHTML = safe;
                                agent.messages[agent.messages.length-1].html = safe;
                                agent.latestLog = 'Generating...';
                                renderAgentsList();
                            }
                            if (data.completed) { agent.running = false; agent.latestLog = 'Done'; renderAgentsList(); }
                            if (data.error) { agent.running = false; agent.latestLog = 'Error: ' + data.error; renderAgentsList(); }
                        } catch(e) { /* ignore parse errors */ }
                    }
                }
            } catch (e) {
                agent.running = false; agent.latestLog = 'Error: ' + e.message; renderAgentsList();
                if (activeAgentId === id) appendBubble('assistant', 'Error: ' + e.message.replace(/</g,'&lt;'));
            }
        }

        document.getElementById('goBtn').addEventListener('click', startWriteup);
        loadModels();
    </script>
</body>
</html>
