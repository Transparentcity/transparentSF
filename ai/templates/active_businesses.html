<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Active Businesses Analysis - TransparentSF</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    
    <!-- Google Analytics Tracking -->
    {% include 'ga_tracking.html' %}

    <!-- Dark Mode CSS -->
    <link rel="stylesheet" href="/static/darkmode.css">
    <script src="/static/js/darkmode.js"></script>
    
    <!-- Plotly.js for charts -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        
        .controls {
            margin-bottom: 25px;
            padding: 20px;
            background-color: var(--bg-secondary);
            border-radius: 8px;
            border: 1px solid var(--border-primary);
        }
        
        .controls button {
            background-color: var(--bright-purple);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .controls button:hover {
            background-color: var(--warm-coral);
        }
        
        .controls button.active {
            background-color: var(--warm-coral);
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 16px;
        }
        
        .error {
            padding: 20px;
            background-color: var(--bg-secondary);
            border: 1px solid #dc3545;
            border-radius: 8px;
            color: #dc3545;
            margin-bottom: 20px;
        }
        
        .table-container {
            overflow-x: auto;
            background-color: var(--bg-secondary);
            border-radius: 8px;
            border: 1px solid var(--border-primary);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        th, td {
            padding: 12px 16px;
            text-align: right;
            border-bottom: 1px solid var(--border-primary);
        }
        
        th {
            background-color: var(--bg-tertiary);
            font-weight: 600;
            color: var(--text-primary);
            position: sticky;
            top: 0;
            text-align: left;
        }
        
        th:first-child,
        td:first-child {
            text-align: left;
        }
        
        tbody tr:hover {
            background-color: var(--bg-tertiary);
        }
        
        .number {
            font-family: 'Courier New', monospace;
            font-weight: 500;
        }
        
        .positive {
            color: #28a745;
        }
        
        .negative {
            color: #dc3545;
        }
        
        .neutral {
            color: var(--text-secondary);
        }
        
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-container {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .chart-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 15px;
        }
        
        #business-chart {
            width: 100%;
            height: 400px;
        }
        
        .stat-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            padding: 20px;
        }
        
        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            table {
                font-size: 12px;
            }
            
            th, td {
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="page-title">Active Businesses Analysis</h1>
        <div class="subtitle" id="page-subtitle">Monthly tracking of active, new, and closing businesses</div>
    </div>
    
    <div class="controls">
        <button id="btn-all" class="active" onclick="loadData(false)">All Businesses</button>
        <button id="btn-restaurants" onclick="loadData(true)">Restaurants Only</button>
    </div>
    
    <div id="loading" class="loading" style="display: none;">
        Loading data...
    </div>
    
    <div id="error-container" class="error" style="display: none;"></div>
    
    <div id="summary-stats" class="summary-stats" style="display: none;"></div>
    
    <div id="chart-container" class="chart-container" style="display: none;">
        <div class="chart-title">Business Trends Over Time</div>
        <div id="business-chart"></div>
    </div>
    
    <div id="table-container" class="table-container" style="display: none;">
        <table id="data-table">
            <thead>
                <tr>
                    <th>Month</th>
                    <th>Active Businesses</th>
                    <th>New Businesses</th>
                    <th>Closing Businesses</th>
                    <th>Net Change</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>

    <script>
        let currentRestaurantOnly = false;
        
        function formatNumber(num) {
            return new Intl.NumberFormat('en-US').format(num);
        }
        
        function updateButtons(restaurantOnly) {
            const btnAll = document.getElementById('btn-all');
            const btnRestaurants = document.getElementById('btn-restaurants');
            
            if (restaurantOnly) {
                btnAll.classList.remove('active');
                btnRestaurants.classList.add('active');
                document.getElementById('page-title').textContent = 'Active Restaurants Analysis';
                document.getElementById('page-subtitle').textContent = 'Monthly tracking of active, new, and closing restaurants';
            } else {
                btnAll.classList.add('active');
                btnRestaurants.classList.remove('active');
                document.getElementById('page-title').textContent = 'Active Businesses Analysis';
                document.getElementById('page-subtitle').textContent = 'Monthly tracking of active, new, and closing businesses';
            }
        }
        
        async function loadData(restaurantOnly) {
            currentRestaurantOnly = restaurantOnly;
            updateButtons(restaurantOnly);
            
            // Show loading, hide error and table
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error-container').style.display = 'none';
            document.getElementById('table-container').style.display = 'none';
            document.getElementById('summary-stats').style.display = 'none';
            document.getElementById('chart-container').style.display = 'none';
            
            try {
                const url = `/api/active-businesses/data?restaurant_only=${restaurantOnly}`;
                const response = await fetch(url);
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Failed to load data');
                }
                
                displayData(result.data);
                
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('error-container').textContent = `Error: ${error.message}`;
                document.getElementById('error-container').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function displayData(data) {
            if (!data || data.length === 0) {
                document.getElementById('error-container').textContent = 'No data available';
                document.getElementById('error-container').style.display = 'block';
                return;
            }
            
            // Calculate summary statistics
            const latest = data[data.length - 1];
            const previous = data.length > 1 ? data[data.length - 2] : null;
            
            // Calculate totals
            const totalNew = data.reduce((sum, row) => sum + row.new, 0);
            const totalClosed = data.reduce((sum, row) => sum + row.closed, 0);
            const totalNetChange = data.reduce((sum, row) => sum + row.net_change, 0);
            
            // Display summary stats
            const summaryHtml = `
                <div class="stat-card">
                    <div class="stat-label">Current Active</div>
                    <div class="stat-value">${formatNumber(latest.active)}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">New (24 months)</div>
                    <div class="stat-value">${formatNumber(totalNew)}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Closed (24 months)</div>
                    <div class="stat-value">${formatNumber(totalClosed)}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Net Change</div>
                    <div class="stat-value ${totalNetChange >= 0 ? 'positive' : 'negative'}">${formatNumber(totalNetChange)}</div>
                </div>
            `;
            document.getElementById('summary-stats').innerHTML = summaryHtml;
            document.getElementById('summary-stats').style.display = 'grid';
            
            // Sort data by date (oldest first)
            const sortedData = [...data].sort((a, b) => {
                if (a.year !== b.year) return a.year - b.year;
                return a.month - b.month;
            });
            
            // Display chart
            displayChart(sortedData);
            
            // Display table
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            sortedData.forEach(row => {
                const tr = document.createElement('tr');
                
                const netChangeClass = row.net_change >= 0 ? 'positive' : 'negative';
                const netChangeSign = row.net_change >= 0 ? '+' : '';
                
                tr.innerHTML = `
                    <td>${row.label}</td>
                    <td class="number">${formatNumber(row.active)}</td>
                    <td class="number">${formatNumber(row.new)}</td>
                    <td class="number">${formatNumber(row.closed)}</td>
                    <td class="number ${netChangeClass}">${netChangeSign}${formatNumber(row.net_change)}</td>
                `;
                
                tbody.appendChild(tr);
            });
            
            document.getElementById('table-container').style.display = 'block';
        }
        
        function displayChart(data) {
            // Prepare data for Plotly
            const labels = data.map(row => row.label);
            const activeData = data.map(row => row.active);
            const newData = data.map(row => row.new);
            const closedData = data.map(row => row.closed);
            
            // Get current theme
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const textColor = isDark ? '#ffffff' : '#222222';
            const gridColor = isDark ? '#444444' : '#e0e0e0';
            const bgColor = isDark ? '#1a1a1a' : '#ffffff';
            
            const traces = [
                {
                    x: labels,
                    y: activeData,
                    name: 'Active',
                    type: 'scatter',
                    mode: 'lines+markers',
                    line: {
                        color: '#4A7463', // Spruce green
                        width: 2
                    },
                    marker: {
                        size: 4
                    }
                },
                {
                    x: labels,
                    y: newData,
                    name: 'New',
                    type: 'scatter',
                    mode: 'lines+markers',
                    line: {
                        color: '#71B2CA', // Sky blue
                        width: 2
                    },
                    marker: {
                        size: 4
                    }
                },
                {
                    x: labels,
                    y: closedData,
                    name: 'Closed',
                    type: 'scatter',
                    mode: 'lines+markers',
                    line: {
                        color: '#FF6B5A', // Warm coral
                        width: 2
                    },
                    marker: {
                        size: 4
                    }
                }
            ];
            
            const layout = {
                title: {
                    text: '',
                    font: { color: textColor }
                },
                xaxis: {
                    title: {
                        text: 'Month',
                        font: { color: textColor }
                    },
                    tickfont: { color: textColor },
                    gridcolor: gridColor,
                    showgrid: true
                },
                yaxis: {
                    title: {
                        text: 'Number of Businesses',
                        font: { color: textColor }
                    },
                    tickfont: { color: textColor },
                    gridcolor: gridColor,
                    showgrid: true
                },
                plot_bgcolor: bgColor,
                paper_bgcolor: bgColor,
                font: {
                    color: textColor,
                    family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
                },
                legend: {
                    font: { color: textColor },
                    x: 0,
                    y: 1,
                    bgcolor: 'rgba(0,0,0,0)'
                },
                hovermode: 'x unified',
                margin: {
                    l: 60,
                    r: 30,
                    t: 20,
                    b: 60
                }
            };
            
            const config = {
                displayModeBar: true,
                responsive: true,
                displaylogo: false,
                modeBarButtonsToRemove: ['pan2d', 'lasso2d']
            };
            
            Plotly.newPlot('business-chart', traces, layout, config);
            document.getElementById('chart-container').style.display = 'block';
        }
        
        // Load data on page load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const restaurantOnly = urlParams.get('restaurant_only') === 'true';
            loadData(restaurantOnly);
        });
    </script>
</body>
</html>
