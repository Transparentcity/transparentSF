# TransparentSF Nginx Configuration
# Place this file in: /etc/nginx/sites-available/transparentsf
# Then symlink to: /etc/nginx/sites-enabled/transparentsf
# Supports: platform.transparentsf.com and beta.transparentsf.com

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    
    server_name platform.transparentsf.com beta.transparentsf.com;
    
    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # Redirect all other requests to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server - Platform and Beta Subdomains
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name platform.transparentsf.com beta.transparentsf.com;
    
    # SSL Certificate (Let's Encrypt will create this path)
    ssl_certificate /etc/letsencrypt/live/platform.transparentsf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.transparentsf.com/privkey.pem;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging
    access_log /var/log/nginx/transparentsf_access.log;
    error_log /var/log/nginx/transparentsf_error.log;
    
    # Client body size
    client_max_body_size 100M;
    
    # Proxy to FastAPI application
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Static files (if any)
    location /static/ {
        alias /opt/transparentsf/ai/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Output files
    location /output/ {
        alias /opt/transparentsf/ai/output/;
        expires 1d;
        add_header Cache-Control "public";
    }
}

